<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>My Furry Friend is Art - Realidad Aumentada</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .instructions {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.75); color: white; text-align: center;
      padding: 12px; font-family: sans-serif; font-size: 15px; z-index: 999;
    }
  </style>
</head>
<body>
  <div class="instructions">🐾 Apunta tu cámara al cuadro y espera unos segundos</div>

  <a-scene
    mindar-image="imageTargetSrc: ./target.mind; autoStart: true; uiScanning: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets>
      <video
        id="dogVideo"
        src="./video.mp4"
        preload="auto"
        loop="true"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        src="#dogVideo"
        width="1"
        height="1.333"
        position="0 0 0"
        rotation="0 0 0"
      ></a-video>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const video = document.querySelector('#dogVideo');

    sceneEl.addEventListener('targetFound', () => {
      video.play();
    });
    sceneEl.addEventListener('targetLost', () => {
      video.pause();
    });
  </script>
</body>
</html>
