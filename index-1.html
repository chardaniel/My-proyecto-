<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>My Furry Friend is Art - Realidad Aumentada</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .instructions {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.75); color: white; text-align: center;
      padding: 12px; font-family: sans-serif; font-size: 15px; z-index: 999;
    }
    .cert-btn {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #c9a24b; color: #1a1a1a; border: none;
      padding: 12px 22px; border-radius: 30px; font-family: sans-serif;
      font-size: 15px; font-weight: bold; z-index: 999; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .cert-panel {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #fdfaf3; color: #1a1a1a;
      font-family: 'Georgia', serif; padding: 24px 20px 30px;
      border-radius: 20px 20px 0 0; z-index: 1000;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
      max-height: 60vh; overflow-y: auto;
    }
    .cert-panel h2 {
      margin: 0 0 4px; font-size: 20px; letter-spacing: 1px;
    }
    .cert-panel .sub { font-size: 13px; color: #7a6a4a; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
    .cert-panel table { width: 100%; border-collapse: collapse; font-size: 15px; }
    .cert-panel td { padding: 8px 0; border-bottom: 1px solid #e6dfc9; }
    .cert-panel td:first-child { color: #7a6a4a; width: 40%; }
    .cert-panel .firma { margin-top: 18px; text-align: right; font-style: italic; font-size: 17px; }
    .cert-close {
      position: absolute; top: 14px; right: 18px; background: none; border: none;
      font-size: 20px; color: #7a6a4a;
    }
  </style>
</head>
<body>
  <div class="instructions">🐾 Toca la pantalla (con sonido), luego apunta tu cámara al cuadro</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets>
      <video
        id="dogVideo"
        src="./video.mp4"
        preload="auto"
        loop="true"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        src="#dogVideo"
        width="1"
        height="1.333"
        position="0 0 0"
        rotation="0 0 0"
      ></a-video>
    </a-entity>
  </a-scene>

  <button class="cert-btn" onclick="document.getElementById('certPanel').style.display='block'">📜 Ver certificado</button>

  <div class="cert-panel" id="certPanel">
    <button class="cert-close" onclick="document.getElementById('certPanel').style.display='none'">✕</button>
    <h2>Chapis</h2>
    <div class="sub">Certificado de autenticidad</div>
    <table>
      <tr><td>Técnica</td><td>Óleo pastel sobre papel de algodón + Realidad Aumentada</td></tr>
      <tr><td>Tamaño</td><td>A4</td></tr>
      <tr><td>Precio</td><td>$1,200 MXN</td></tr>
    </table>
    <div class="firma">— CharDD</div>
  </div>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const video = document.querySelector('#dogVideo');

    // Desbloquea la reproducción de video (con sonido) en el primer toque
    // (los navegadores móviles exigen una interacción real del usuario antes de permitir audio)
    function unlockVideo() {
      video.play().then(() => {
        video.pause();
        video.currentTime = 0;
      }).catch(() => {});
      document.removeEventListener('touchstart', unlockVideo);
      document.removeEventListener('click', unlockVideo);
    }
    document.addEventListener('touchstart', unlockVideo, { once: true });
    document.addEventListener('click', unlockVideo, { once: true });

    sceneEl.addEventListener('targetFound', () => {
      video.play();
    });
    sceneEl.addEventListener('targetLost', () => {
      video.pause();
    });
  </script>
</body>
</html>
